name: Check and deploy game

on:
  push:
    branches: [main, artemageddon]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Обе ветки обновляют один сайт. Общая очередь включает и проверку, и публикацию,
# чтобы медленная старая сборка не отправилась в деплой после более новой.
# PR и ручные проверки других веток не занимают очередь публикации.
concurrency:
  group: >-
    ${{ github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/artemageddon') &&
        'github-pages' || format('pages-check-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  check:
    name: Check and package game
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node -e "const vm = require('node:vm'); const read = require('./scripts/read-game-code.cjs'); for (const name of ['viewport', 'bridge-sound', 'data', 'story-director', 'campaign-data', 'graphics-vfx', 'minigames', 'game', 'accessibility']) new vm.Script(read('js/' + name + '.js'), { filename: 'index.html#game-' + name });"
          for file in scripts/*.cjs; do
            node --check "$file"
          done

      - name: Validate campaigns and events
        run: node scripts/check-data.cjs

      - name: Check optional mini-game cards
        run: node scripts/check-minigames.cjs

      - name: Package public files
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll

      - name: Upload website
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/artemageddon')
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/artemageddon')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
